<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Chat Panel</title>
<style>
#chatWindow { width: 400px; height: 400px; border: 1px solid #ccc; padding: 10px; overflow-y: auto; }
.user { background-color: #d1e7dd; text-align: right; }
.admin { background-color: #f1f0f0; text-align: left; }
.message { padding: 8px; margin: 5px; border-radius: 5px; }
</style>
</head>
<body>

<h3>Admin Chat Panel</h3>

<label>Select User:</label>
<select id="userSelect"></select>

<div id="chatWindow"></div>

<form id="chatForm">
  <input type="text" id="messageInput" placeholder="Type your message..." required style="width:300px;">
  <button type="submit">Send</button>
</form>

<script>
let chat_id = 0;

async function loadUsers() {
  const response = await fetch('getUsers.php'); 
  const users = await response.json();
  const userSelect = document.getElementById('userSelect');
  userSelect.innerHTML = '';
  users.forEach(u => {
    const option = document.createElement('option');
    option.value = u.user_id;
    option.textContent = u.username;
    userSelect.appendChild(option);
  });
  chat_id = users[0]?.user_id || 0;
  loadMessages();
}

document.getElementById('userSelect').addEventListener('change', function(){
  chat_id = this.value;
  loadMessages();
});

async function loadMessages() {
  if(chat_id==0) return;
  const response = await fetch(`getMessages.php?chat_id=${chat_id}`);
  const messages = await response.json();
  const chatWindow = document.getElementById('chatWindow');
  chatWindow.innerHTML = '';
  messages.forEach(msg => {
    const div = document.createElement('div');
    div.textContent = msg.message;
    div.className = 'message ' + (msg.sender === 'admin' ? 'admin' : 'user');
    chatWindow.appendChild(div);
  });
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

document.getElementById('chatForm').addEventListener('submit', async function(e){
  e.preventDefault();
  if(chat_id==0) return;
  const message = document.getElementById('messageInput').value;
  if(!message) return;

  await fetch('sendMessage.php',{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:`chat_id=${chat_id}&message=${encodeURIComponent(message)}&sender=admin`
  });

  document.getElementById('messageInput').value='';
  loadMessages();
});

setInterval(loadMessages, 2000);
loadUsers();
</script>

</body>
</html>
